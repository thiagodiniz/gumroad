apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: gumroad

resources:
  - ../../base

# CI pins newTag to the git SHA it built (kustomize edit set image ...).
images:
  - name: gumroad/tax-id-validation
    newName: gumroad/tax-id-validation
    newTag: latest

patches:
  - target:
      kind: ConfigMap
      name: tax-id-validation
    patch: |-
      - op: replace
        path: /data/APP_ENV
        value: production
  - target:
      kind: Deployment
      name: tax-id-validation
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
  - target:
      kind: HorizontalPodAutoscaler
      name: tax-id-validation
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 3
      - op: replace
        path: /spec/maxReplicas
        value: 10
