# Not applied by kustomize. Create the real Secret out of band, e.g.:
#   kubectl -n gumroad create secret generic tax-id-validation \
#     --from-literal=INTERNAL_AUTH_TOKEN=... \
#     --from-literal=VATSTACK_API_KEY=... \
#     --from-literal=IRAS_API_ID=... --from-literal=IRAS_API_SECRET=... \
#     --from-literal=TAX_ID_PRO_API_KEY=...
# or let the external-secrets operator materialize it from the same store that feeds
# the Rails credentials. The keys are the GlobalConfig names used by Rails.
apiVersion: v1
kind: Secret
metadata:
  name: tax-id-validation
type: Opaque
stringData:
  INTERNAL_AUTH_TOKEN: change-me
  VATSTACK_API_KEY: ""
  IRAS_API_ID: ""
  IRAS_API_SECRET: ""
  TAX_ID_PRO_API_KEY: ""
