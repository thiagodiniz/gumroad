# Not applied by kustomize. Create the real Secret out of band, e.g.:
#   kubectl -n gumroad create secret generic ping-delivery \
#     --from-literal=INTERNAL_AUTH_TOKEN=...
# or let the external-secrets operator materialize it from the same store that feeds
# the Rails credentials. The service posts to seller-owned endpoints and needs no other keys.
apiVersion: v1
kind: Secret
metadata:
  name: ping-delivery
type: Opaque
stringData:
  INTERNAL_AUTH_TOKEN: change-me
