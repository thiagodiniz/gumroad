apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/name: ping-delivery
  - pairs:
      app.kubernetes.io/part-of: gumroad

resources:
  - deployment.yaml
  - service.yaml
  - configmap.yaml
