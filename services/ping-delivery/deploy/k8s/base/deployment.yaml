apiVersion: apps/v1
kind: Deployment
metadata:
  name: ping-delivery
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ping-delivery
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ping-delivery
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      # The pod only needs to be scheduled away from its siblings; no node affinity.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: ping-delivery
      containers:
        - name: server
          image: gumroad/ping-delivery:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: ping-delivery
            - secretRef:
                name: ping-delivery
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
      # (OPEN_TIMEOUT + READ_TIMEOUT) * (MAX_REDIRECTS + 1) = 40s, plus SHUTDOWN_TIMEOUT (20s),
      # so a delivery that started just before SIGTERM can still answer before SIGKILL.
      terminationGracePeriodSeconds: 60
