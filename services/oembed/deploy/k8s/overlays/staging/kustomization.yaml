apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: gumroad-staging

resources:
  - ../../base

images:
  - name: gumroad/oembed
    newName: ghcr.io/thiagodiniz/oembed
    newTag: latest

patches:
  - target:
      kind: Deployment
      name: oembed
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: HorizontalPodAutoscaler
      name: oembed
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
